<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000032">
  <meta name="app-version" content="0.6.2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Kiekkokirjuri – ottelun maalit, torjunnat ja jäähyt helposti, myös ilman verkkoyhteyttä.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=0.6.2">
  <title>Kiekkokirjuri · Kiekko-Espoo</title>
</head>
<body>
  <a class="skip-link" href="#main">Siirry sisältöön</a>
  <header class="app-header"><div class="header-inner">
    <a class="brand" href="#ottelu" aria-label="Kiekkokirjuri, ottelunäkymä">
      <img src="./assets/club-logo.svg" width="46" height="46" alt="Kiekko-Espoo">
      <span><span class="brand-kicker">KIEKKO-ESPOO</span><span class="brand-title">Kiekkokirjuri<span class="brand-dot">.</span></span></span>
    </a>
    <div class="header-actions">
      <span class="connection-indicator" id="connection-status"><span class="status-dot"></span><span id="connection-label">Tallennus laitteelle</span></span>
      <button type="button" class="icon-button header-menu" data-action="menu" aria-label="Asetukset ja varmuuskopio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div></header>
  <div id="update-banner" class="update-banner" hidden></div>
  <div id="storage-banner" class="storage-banner" role="alert" hidden></div>
  <main id="main" class="main" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Päänavigaatio" id="navigation"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><div id="sheet-content"></div></dialog>
  <input type="file" id="restore-file" accept=".json,application/json" hidden>
  <noscript><p class="no-script">Ota JavaScript käyttöön, jotta voit käyttää Kiekkokirjuria.</p></noscript>
  <script type="module" src="./app.js?v=0.6.2"></script>
</body>
</html>
