<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082447"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon.svg"><title>Kiekkokirjuri</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:#102744;font:16px system-ui}header{background:#082447;color:white;padding:18px;font-weight:800;letter-spacing:2px}main{max-width:650px;margin:auto;padding:12px}section{background:white;border-radius:16px;padding:16px;margin:12px 0}button,input,select,textarea{font:inherit;padding:11px;border:1px solid #c4d0df;border-radius:10px;min-width:0}button{background:#e7eef7;color:#082447;font-weight:700;min-height:44px;cursor:pointer}button.primary{background:#082447;color:white}input{width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row>*{flex:1}.score{text-align:center;font-size:54px;font-weight:900}.clock{text-align:center;font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}h2{font-size:18px;margin:0 0 12px}small{color:#61748a}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}.event{padding:10px 0;border-bottom:1px solid #eee}.event button{float:right}textarea{width:100%;min-height:120px}body{background:#eef2f8;color:#000032}header{display:flex;align-items:center;gap:12px;background:#000032;padding:16px max(16px,env(safe-area-inset-left));border-bottom:4px solid #fedd00;letter-spacing:0}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#fedd00;color:#000032;font-size:28px;font-weight:900;flex:none}.brand-name{font-size:19px;letter-spacing:1.4px;font-weight:900}.brand-sub{font-size:11px;color:#c2d2ef;margin-top:3px}main{padding:12px 12px 36px}section{box-shadow:0 2px 12px #0000320b;border:1px solid #dce4f0;margin:10px 0;padding:14px}.scoreboard{background:#000032;color:#fff;border:0}.scoreboard input{background:#ffffff10;color:#fff;border-color:#ffffff38;text-align:center;font-weight:700}.scoreboard small{color:#c4d4ef}.scoreboard .score{font-size:64px;line-height:1.1;font-variant-numeric:tabular-nums}.scoreboard .clock{font-size:48px;line-height:1.15;letter-spacing:2px;color:#fedd00}.scoreboard button.primary{background:#fedd00;color:#000032}.scoreboard button:not(.primary){background:#19336b;color:#fff;border-color:#35518a}.scoreboard label{font-size:13px}.scoreboard label input{margin-top:5px}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.action-grid button{min-height:68px;font-size:20px;background:#003da5;color:white;border:0;border-radius:12px}.action-grid .goal{background:#fedd00;color:#000032}.actions h2{font-size:15px;text-transform:uppercase;letter-spacing:.7px}.actions small{display:block;font-size:12px}.players button{min-height:56px;border-color:#cad8f0;background:#edf3ff}button.primary{background:#003da5;color:white}button{touch-action:manipulation}#pending:not(:empty){margin-top:12px;background:#f2f6fd;border-radius:12px;padding:12px}#pending hr{display:none}#pending .row button{min-height:48px}#pending select{margin:6px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0076ce;outline-offset:2px}@media(max-width:360px){.brand-sub{font-size:10px}.scoreboard .score{font-size:54px}.row{gap:5px}.row button{font-size:13px}}</style></head><body><header><div class="brand-mark" aria-hidden="true">K</div><div><div class="brand-name">KIEKKOKIRJURI</div><div class="brand-sub">Kiekko-Espoo · epävirallinen ottelutyökalu · v0.5</div></div></header><main id="app"></main><script>
const key='ke-match-v1';const fresh=()=>({home:'Kiekko-Espoo',away:'Vastustaja',period:1,periodLength:1200,seconds:0,start:null,roster:[],events:[],archive:[]});let s=fresh();try{s=JSON.parse(localStorage.getItem(key))||s}catch{}s.periodLength=s.periodLength||1200;let pending=null;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){alert('Tallennus ei onnistunut: '+e.message)}}function elapsed(){return Math.min(s.periodLength,s.seconds+(s.start?Math.max(0,Math.floor((Date.now()-s.start)/1000)):0))}function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function scores(g=s){return ['home','away'].map(t=>g.events.filter(e=>e.type==='Maali'&&e.team===t).length)}function shotStats(g=s){return ['home','away'].map(t=>{let opp=t==='home'?'away':'home';return {shots:g.events.filter(e=>e.team===t&&['Laukaus','Maali'].includes(e.type)||e.team===opp&&e.type==='Torjunta').length,saves:g.events.filter(e=>e.team===t&&e.type==='Torjunta').length}})}function player(n,team='home'){let p=s.roster.find(p=>p.n===n&&(p.team||'home')===team);return n?'#'+n+(p?.name?' '+p.name:''):'Tuntematon'}function eventText(e){return e.period+'. erä '+fmt(e.time)+' | '+s[e.team]+' | '+e.type+' '+(e.n?player(e.n,e.team):'')+(e.assists?.length?' | Syötöt: '+e.assists.map(n=>player(n,e.team)).join(', '):'')+(e.reason?' | '+e.reason:'')+(e.detail?' | '+e.detail:'')+(e.penaltyLabel&&e.type==='Jäähy'?' | '+e.penaltyLabel:e.minutes?' '+e.minutes+' min':'')}function report(){let [a,b]=scores();return s.home+' '+a+'–'+b+' '+s.away+'\nLaukaukset: '+shotStats().map(x=>x.shots).join('–')+' | Torjunnat: '+shotStats().map(x=>x.saves).join('–')+'\n'+s.events.map(eventText).join('\n')}
function render(){let [a,b]=scores();$('app').innerHTML=`<section class="scoreboard"><div class="row"><input id="home" aria-label="Kotijoukkue" value="${esc(s.home)}"><input id="away" aria-label="Vierasjoukkue" value="${esc(s.away)}"></div><div class="score">${a} – ${b}</div><div style="text-align:center"><small>Laukaukset: ${shotStats().map(x=>x.shots).join(" – ")} · Torjunnat: ${shotStats().map(x=>x.saves).join(" – ")}</small></div><div style="text-align:center">${s.period}. ERÄ</div><div class="clock" id="clock">${fmt(s.periodLength-elapsed())}</div><div class="row"><label>Erän pituus (min)<input type="number" min="1" max="60" value="${s.periodLength/60}" onchange="setLength(this.value)" ${s.start||s.seconds?'disabled':''}></label></div><div class="row"><button class="primary" onclick="toggle()">${s.start?'Pysäytä':s.seconds?'Jatka erää':'Aloita erä'}</button><button onclick="setClock()">Aseta aika</button><button onclick="nextPeriod()">Seuraava erä</button></div></section><section class="actions"><h2>Kirjaa tapahtuma</h2><div class="action-grid"><button class="goal" onclick="chooseTeam('Maali')">Maali</button><button onclick="chooseTeam('Jäähy')">Jäähy</button><button onclick="chooseTeam('Laukaus')">Laukaus</button><button onclick="chooseTeam('Torjunta')">Torjunta</button></div><small>Maali ja torjunta lasketaan myös laukaukseksi. Älä kirjaa samaa laukausta kahdesti.</small><div id="pending"></div></section><section><h2>Pelaajat</h2><small>Lisää numerot ja sukunimet nyt tai myöhemmin.</small><div class="row"><select id="team"><option value="home">Oma</option><option value="away">Vieras</option></select><input id="number" type="number" min="0" max="99" placeholder="Nro"><input id="surname" placeholder="Sukunimi"></div><button onclick="addPlayer()">Lisää / päivitä</button>${['home','away'].map(t=>`<p><b>${esc(s[t])}</b></p><div class="players">${s.roster.filter(p=>(p.team||'home')===t).map(p=>`<button onclick="editPlayer('${p.n}','${t}')">#${p.n}<br><small>${esc(p.name)}</small></button>`).join('')}</div>`).join('')}</section><section><h2>Tapahtumat</h2>${s.events.slice().reverse().map((e)=>`<div class="event"><button onclick="removeEvent(${s.events.indexOf(e)})">Poista</button><small>${e.period}. erä · ${fmt(e.time)}</small><br><b>${esc(s[e.team])} · ${esc(e.type)}</b><br>${esc(e.n?player(e.n,e.team):'')}${e.assists?.length?' · '+esc(e.assists.map(n=>player(n,e.team)).join(', ')):''}${e.reason?' · '+esc(e.reason):''}${e.penaltyLabel&&e.type==='Jäähy'?' · '+esc(e.penaltyLabel):e.minutes?' '+e.minutes+' min':''}${e.detail?' · '+esc(e.detail):''}</div>`).join('')||'Ei tapahtumia'}</section><section><h2>Pelaajatilastot</h2>${s.roster.map(p=>{let t=p.team||'home',es=s.events.filter(e=>e.team===t),g=es.filter(e=>e.type==='Maali'&&e.n===p.n).length,a=es.filter(e=>e.type==='Maali'&&e.assists?.includes(p.n)).length;return '<p>'+esc(s[t])+' · '+esc(player(p.n,t))+' — '+g+' M / '+a+' S / '+(g+a)+' P / '+es.filter(e=>e.n===p.n&&['Laukaus','Maali'].includes(e.type)).length+' L / '+es.filter(e=>e.n===p.n&&e.type==='Torjunta').length+' T</p>'}).join('')||'Ei pelaajia'}</section><section><h2>Ottelukooste</h2><div class="row"><button onclick="showReport()">Tekstiraportti</button><button onclick="poster()">PNG-kuva</button></div><div id="out"></div></section><section><h2>Ottelut ja varmuuskopio</h2><div class="row"><button onclick="newGame()">Arkistoi ja uusi peli</button><button onclick="backup()">Vie JSON</button><button onclick="$('restore').click()">Palauta</button></div><input hidden id="restore" type="file" accept="application/json" onchange="restore(this)"><p><small>${s.archive.length} arkistoitua ottelua</small></p>${s.archive.map((g,i)=>`<button onclick="loadGame(${i})">${esc(g.home)} – ${esc(g.away)} (${scores(g).join('–')})</button>`).join('')}</section>`;for(let k of ['home','away'])$(k).onchange=()=>{s[k]=$(k).value;save();render()};drawPending()}
function setLength(v){if(s.start||s.seconds)return;let n=Number(v);if(n>=1&&n<=60&&Number.isInteger(n)){s.periodLength=n*60;save()}render()}function toggle(){if(elapsed()>=s.periodLength){s.seconds=s.periodLength;s.start=null;save();render();return}if(s.start){s.seconds=elapsed();s.start=null}else s.start=Date.now();save();render()}function setClock(){let x=prompt('Jäljellä oleva aika mm:ss',fmt(s.periodLength-elapsed()));if(x&&/^\d+:([0-5]\d)$/.test(x)){let [m,t]=x.split(':').map(Number);s.seconds=Math.max(0,s.periodLength-Math.min(s.periodLength,m*60+t));s.start=null;save();render()}}function nextPeriod(){if(confirm('Aloita seuraava erä?')){s.period++;s.seconds=0;s.start=null;save();render()}}function addPlayer(){let n=$('number').value,t=$('team').value;if(n===''||!Number.isInteger(+n)||+n<0||+n>99)return alert('Anna numero 0–99');n=String(+n);let name=$('surname').value.trim();let p=s.roster.find(p=>p.n===n&&(p.team||'home')===t);if(p)p.name=name;else s.roster.push({n,name,team:t});s.roster.sort((a,b)=>a.n-b.n);save();render()}function editPlayer(n,t){$('team').value=t;$('number').value=n;$('surname').value=s.roster.find(p=>p.n===n&&(p.team||'home')===t).name;$('surname').focus()}
const reasons=["56 – Estäminen","57 – Kampitus","54 – Kiinnipitäminen","55 – Koukkaaminen","60 – Korkea maila","59 – Poikittainen maila","61 – Huitominen","58 – Mailan päällä tökkääminen","62 – Keihästäminen","41 – Laitataklaus","42 – Ryntäys","43 – Selästä taklaaminen","44 – Leikkaaminen","45 – Kyynärpäätaklaus","46 – Tappeleminen","47 – Pääpusku","48 – Päähän tai niskaan kohdistuva taklaus","49 – Potkaiseminen","50 – Polvitaklaus","51 – Väkivaltaisuus","52 – Jalkapyyhkäisy","53 – Varusteiden heittäminen","63 – Pelin viivyttäminen","64 – Sukeltaminen / teeskentely","65 – Varusteet","67 – Kiekon käsittely kädellä","68 – Sääntöjenvastainen vaihto","69 – Maalivahdin estäminen","70 – Penkiltä poistuminen","21 – Vaarallinen teko","73 – Pelistä kieltäytyminen","74 – Liian monta pelaajaa jäällä","75 – Epäurheilijamainen käytös","39 – Sopimaton käytös tuomaristoa kohtaan","40 – Tuomariston fyysisen koskemattomuuden loukkaaminen","9 – Peliasu","10 – Maila","12 – Sääntöjenvastainen varuste","76 – Aloitusrike","Muu / sarjakohtainen rike"];const penaltyTypes=[['2','2 min – pieni'],['2.01','2 min – joukkuerangaistus'],['4','2+2 min – kaksinkertainen pieni'],['5','5 min – iso'],['10','10 min – käytös'],['20','Pelirangaistus'],['25','5 min + pelirangaistus'],['0','Rangaistuslaukaus'],['1','1 min – juniorisääntö'],['3','3 min – sarjakohtainen']];function chooseTeam(type){pending=null;let time=elapsed(),period=s.period;let panel=$('pending');panel.innerHTML='<hr><b>'+esc(type)+' – valitse joukkue</b><div class="row"></div>';let row=panel.lastElementChild;for(let team of ['home','away']){let b=document.createElement('button');b.textContent=s[team];b.onclick=()=>{begin(type,team,time,period)};row.appendChild(b)}let cancel=document.createElement('button');cancel.textContent='Peruuta';cancel.onclick=()=>{panel.innerHTML=''};panel.appendChild(cancel)}function begin(type,team,time=elapsed(),period=s.period){pending={type,team,time,period,n:'',assists:[],reason:'',minutes:2,penaltyLabel:'2 min – pieni'};drawPending()}function drawPending(){if(!pending)return;let p=pending,r=s.roster.filter(x=>(x.team||'home')===p.team);$('pending').innerHTML=`<hr><b>${p.type} · ${fmt(p.time)}</b><p>Pelaaja: ${esc(p.n?player(p.n,p.team):'ei valittu')}</p><div class="players">${r.map(x=>`<button onclick="pick('${x.n}')">#${x.n}<br><small>${esc(x.name)}</small></button>`).join('')}</div><div class="row"><input id="manual" type="number" placeholder="Pelaajan numero"><button onclick="pickManual()">Valitse</button></div>${p.type==='Maali'?`<p>Syöttäjät: ${esc(p.assists.map(n=>player(n,p.team)).join(', '))}</p><div class="players">${r.filter(x=>x.n!==p.n).map(x=>`<button onclick="assist('${x.n}')">${p.assists.includes(x.n)?'✓ ':''}#${x.n}</button>`).join('')}</div><div class="row"><input id="manualAssist" type="number" placeholder="Syöttäjän nro"><button onclick="manualAssist()">Lisää syöttäjä</button></div>`:p.type==='Jäähy'?`<label>Jäähyn syy<select style="width:100%" onchange="pending.reason=this.value"><option value="">Valitse rike</option>${reasons.map(r=>`<option ${p.reason===r?'selected':''}>${esc(r)}</option>`).join('')}</select></label><input placeholder="Tarkennus (valinnainen)" value="${esc(p.detail||'')}" oninput="pending.detail=this.value"><label>Rangaistus<select style="width:100%" onchange="pending.minutes=Number(this.value);pending.penaltyLabel=this.options[this.selectedIndex].text">${penaltyTypes.map(([v,l])=>`<option value="${v}" ${p.minutes===Number(v)?'selected':''}>${l}</option>`).join('')}</select></label>`:''}<div class="row"><button class="primary" onclick="commit()">Tallenna</button><button onclick="pending=null;render()">Peruuta</button></div>`}function pick(n){pending.n=n;pending.assists=pending.assists.filter(a=>a!==n);drawPending()}function valid(n){return n!==''&&Number.isInteger(+n)&&+n>=0&&+n<=99}function pickManual(){let n=$('manual').value;if(valid(n))pick(String(+n))}function manualAssist(){let n=$('manualAssist').value;if(valid(n)&&String(+n)!==pending.n)assist(String(+n))}function assist(n){let a=pending.assists;if(a.includes(n))pending.assists=a.filter(x=>x!==n);else if(a.length<2)a.push(n);drawPending()}function commit(){if(pending.type==='Jäähy')pending.minutes=pending.minutes===2.01?2:Math.max(0,pending.minutes);else{delete pending.minutes;delete pending.reason;delete pending.penaltyLabel}for(let n of [pending.n,...pending.assists])if(n&&!s.roster.some(p=>p.n===n&&(p.team||'home')===pending.team))s.roster.push({n,name:'',team:pending.team});s.events.push({...pending});pending=null;save();render()}function removeEvent(i){if(confirm('Poistetaanko tapahtuma?')){s.events.splice(i,1);save();render()}}function showReport(){$('out').innerHTML='<textarea readonly>'+esc(report())+'</textarea><button onclick="navigator.clipboard?.writeText(report()).catch(()=>alert(\'Kopioi teksti käsin\'))">Kopioi</button>'}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}function poster(){let c=document.createElement('canvas');c.width=1080;c.height=Math.max(1080,550+s.events.length*48);let x=c.getContext('2d');x.fillStyle='#000032';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fedd00';x.fillRect(0,0,1080,20);x.textAlign='center';x.fillStyle='white';x.font='bold 44px system-ui';x.fillText('OTTELUKOOSTE',540,100);x.font='bold 38px system-ui';x.fillText(s.home+' — '+s.away,540,190,1000);x.font='bold 160px system-ui';x.fillText(scores().join(' – '),540,380);x.font='bold 30px system-ui';x.fillText('Laukaukset '+shotStats().map(z=>z.shots).join(' – ')+'   |   Torjunnat '+shotStats().map(z=>z.saves).join(' – '),540,435,1000);x.textAlign='left';x.font='28px system-ui';s.events.forEach((e,i)=>x.fillText(eventText(e),45,480+i*48,990));c.toBlob(b=>{if(b)download(b,'ottelukooste.png')})}function backup(){download(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),'kiekko-varmuuskopio.json')}async function restore(input){try{let t=JSON.parse(await input.files[0].text());if(!Array.isArray(t.events)||!Array.isArray(t.roster)||!Array.isArray(t.archive))throw Error();if(confirm('Korvataanko nykyiset tiedot?')){s=t;s.periodLength=s.periodLength||1200;save();render()}}catch{alert('Virheellinen varmuuskopio')}}function snapshot(){let {archive,...g}=s;return {...g,start:null,seconds:elapsed()}}function newGame(){if(!confirm('Arkistoi nykyinen ottelu ja aloita uusi?'))return;let a=[...s.archive,snapshot()],h=s.home;s={...fresh(),periodLength:s.periodLength,archive:a,roster:[],home:h};pending=null;save();render()}function loadGame(i){if(!confirm('Arkistoidaanko nykyinen peli ja avataanko valittu?'))return;let a=s.archive.slice(),g=a.splice(i,1)[0];a.push(snapshot());s={...g,periodLength:g.periodLength||1200,archive:a};pending=null;save();render()}render();setInterval(()=>{if(s.start&&elapsed()>=s.periodLength){s.seconds=s.periodLength;s.start=null;save();render()}if($('clock'))$('clock').textContent=fmt(s.periodLength-elapsed())},250);if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
